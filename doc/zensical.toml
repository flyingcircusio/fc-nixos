# Explicit navigation -- the Zensical equivalent of the hand-curated MyST
# toctree groups that drove the Sphinx/furo sidebar (uncaptioned root group,
# "Infrastructure (IaaS & Resources)", "Platform (Operations & Concepts)",
# generated platform-version group). Group
# titles use the sections' real page headings.
#
# NOTE: the nav key lives INSIDE the [project] table -- zensical's config
# parser keeps ONLY the [project] table when it is present and silently
# drops every top-level key (probed 2026-08-17).
#
# Pages present in docs_dir but NOT listed here are still built, just not
# linked in the sidebar (probed: zensical emits no warning for unlisted
# pages): index.md (the manual index -- reached via the logo/site-title
# links instead of a redundant nav entry), devopsguide-de.md (linked from
# dead media, do not rename), platform/users/ssh-keygen.md (hidden
# toctree entry in the Sphinx manual).
# All of them -- and every archived platform-releases/ page (adapted by
# tools.fetch_platform_docs) -- carry `search: exclude: true` frontmatter so
# they stay out of the search index (probed: search.json drops them).
#
# Two blocks between marker comments are GENERATED -- never edit by hand:
#   # BEGIN/END changes-releases    tools.generate_release_notes rewrites
#                                   this from src/changes/ (one group per
#                                   year, index + r-pages, newest first)
#   # BEGIN/END platform-versions   tools.fetch_platform_docs rewrites this
#                                   from platform-versions.yaml (ONE wrapper
#                                   group "Platform Releases (Versioned
#                                   Docs)" holding every platform version,
#                                   stable first, then archived in config
#                                   order, labelled wip-style with the
#                                   "Platform " prefix; the local theme/
#                                   partials/nav-item.html override keeps
#                                   the Changelog collapsible while
#                                   navigation.sections makes the other
#                                   top-level groups static -- the global
#                                   navigation.expand feature is NOT used)
[project]
site_name    = "Flying Circus Platform"
site_url     = "https://docs.flyingcircus.io"
copyright    = "Flying Circus Internet Operations GmbH"
docs_dir     = "src"
site_dir     = "_build"
extra_css    = [
    "_static/flyingcircus.css",
    "_static/version-switcher.css",
    "_static/vendor/glightbox.min.css",
]
# Load order matters: the data file provides window.PLATFORM_VERSIONS,
# the URL module (window.VersionSwitcherUrls) must exist before
# version-switcher.js consumes it, and the language rule
# (window.LanguageSwitcherUrls) before language-switcher.js rewrites the
# header dropdown hrefs (version-prefix-preserving: page.url is baked
# WITHOUT the version prefix this tree is served under). The vendored
# glightbox runtime + shim come first: the runtime defines
# window.GLightbox (so the theme bundle never lazy-loads it from
# unpkg.com), the shim rewrites the bundle's unconditional unpkg
# stylesheet link to the local vendor copy (same self-hosting policy as
# the vendored fonts).
extra_javascript = [
    "_static/vendor/glightbox.min.js",
    "_static/glightbox-local.js",
    "_static/platform-versions.js",
    "_static/version-switcher-urls.js",
    "_static/version-switcher.js",
    "_static/version-switcher-fallback.js",
    "_static/language-switcher-urls.js",
    "_static/language-switcher.js",
]

