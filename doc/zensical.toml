[project.theme]
language = "en"
variant  = "classic"
logo     = "_static/RZ_FC-Logo_RGB_100-1080.svg"
# Local template overrides (theme/partials/...): the logo anchors link the
# manual index even though index.md is not in the nav (upstream would link
# the FIRST nav page there).
custom_dir = "theme"
features = [
    "content.code.copy",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

# Self-hosted fonts: font = false suppresses the Google Fonts <link> and the
# theme's --md-text-font/--md-code-font <style> (base.html); the @font-face
# declarations and :root variables in _static/flyingcircus.css restore the
# same typefaces from the vendored woff2 files in _static/fonts/.
# NOTE: this key must stay BEFORE the [[project.theme.palette]] arrays --
# bare keys after an array-of-tables header belong to the last array element.
font = false

[[project.theme.palette]]
scheme      = "default"
primary     = "custom"
accent      = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme      = "slate"
primary     = "custom"
accent      = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Language switcher targets as served by deploy/docs.nix: the English manual
# at / (URL stability -- the root keeps its EN content), the German manual
# under /de/. These entries are the language ROOTS -- static config cannot
# express per-page targets. The local theme/partials/alternate.html override
# appends the page's root-relative URL at render time, so the header dropdown
# links the SAME PAGE in the other language; the roots remain as fallback for
# the homepage and page-less contexts (both builds render identical page URLs,
# pinned by tests/test_alternate_links.py). KNOWN LIMITATION: the head
# <link rel="alternate" hreflang> tags (base.html) still point at the two
# roots -- SEO-relevant only, no functional impact.
[project.extra]
alternate = [
    { name = "English", link = "/", lang = "en" },
    { name = "Deutsch", link = "/de/", lang = "de" },
]

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums     = true
line_spans          = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tilde]
[project.markdown_extensions.zensical.extensions.macros]
module_name = "docs_hooks"

# Strip MyST % comment lines before the macros preprocessor runs (priority 40
# vs 35), so Jinja2 syntax in comment lines is never rendered.
[project.markdown_extensions.md_comments]

# Image zoom via lightbox overlay (bundled zensical extension, no new
# dependency): content images (screenshots, diagrams) become click-to-zoom.
# The decorative {.logo} section thumbnails are excluded via skip_classes
# (off-glb is a built-in skip); alt text doubles as the lightbox caption.
# flyingcircus.css caps the inline previews at 24em, so the lightbox (which
# never upscales) always opens larger AND sharp (user decision 2026-08-20).
# The runtime itself is vendored under _static/vendor/ (see extra_css and
# extra_javascript) -- the theme bundle's unpkg.com lazy-load stays dormant.
[project.markdown_extensions.zensical.extensions.glightbox]
auto_caption = true
skip_classes = ["logo"]

# Zensical validates links of earlier-alphabetical nav groups before
# registering later ones (alphabetical ordering bug), producing false-positive
# "page does not exist" warnings for cross-section links whose HTML output is
# correct. Disable the check until upstream fixes the ordering issue.
[project.validation]
invalid_links = false
