vrrp_script check_default_route_v4 {
      script "/etc/keepalived/check-default-route-v4"
      interval 1
      fall 2
      rise 2
}

vrrp_script check_default_route_v6 {
      script "/etc/keepalived/check-default-route-v6"
      interval 1
      fall 2
      rise 2
}

vrrp_sync_group router {
    group { mgm srv fe }

    notify_master "/etc/keepalived/fc-keepalived notify master"
    notify_backup "/etc/keepalived/fc-keepalived notify backup"
    notify_fault "/etc/keepalived/fc-keepalived notify fault"
    notify_stop "/etc/keepalived/fc-keepalived notify stop"

    track_script {
        check_default_route_v4 weight 10
        check_default_route_v6 weight 5
    }

    track_file {
      fcio_check_stop_file
      fcio_check_maint_file
    }
}

vrrp_instance mgm {
    interface ethmgm
    state BACKUP
    virtual_router_id 51
    priority 100
    advert_int 1
    garp_master_refresh 30
    dont_track_primary

    virtual_ipaddress {
        fdfc:c12:c05:1::1/64 preferred_lft 0
    }

    virtual_ipaddress_excluded {
        192.168.1.1/24
    }
}

vrrp_instance fe {
    interface ethfe
    state BACKUP
    virtual_router_id 51
    priority 100
    advert_int 1
    garp_master_refresh 30

    virtual_ipaddress {
        fdfc:c12:c05:2::1/64
    }

    virtual_ipaddress_excluded {
        172.20.2.1/24
    }

}

vrrp_instance srv {
    interface ethsrv
    state BACKUP
    virtual_router_id 51
    priority 100
    advert_int 1
    garp_master_refresh 30

    virtual_ipaddress {
        fdfc:c12:c05:3::1/64
    }

    virtual_ipaddress_excluded {
        192.168.3.1/24
    }
}
