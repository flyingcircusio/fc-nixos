[project]
name = "fc.agent"
version = "1.0"

description = "FC NixOS platform management utilities."

authors = [
  {name = "Flying Circus IO GmbH <mail@flyingcircus.io>", email = "mail@flyingcircus.io" }
]

license = "ZPL-2.1"

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]

requires-python = "==3.12.*"
dependencies = [
    # keep-sorted start
    "PyYAML>=6",
    "click",
    "configobj",
    "iso8601",
    "netaddr",
    "pendulum",
    "python-dateutil",
    "requests",
    "rich",
    "shortuuid",
    "stamina",
    "structlog",
    "typer",
    # keep-sorted end
]

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/"]
include = [
    # keep-sorted start
    "fc.maintenance",
    "fc.maintenance.activity",
    "fc.maintenance.lib",
    "fc.manage",
    "fc.util",
    # keep-sorted end
]

[project.optional-dependencies]
test = [
    # keep-sorted start
    "freezegun>=0.3",
    "pytest-cov",
    "pytest-mock",
    "pytest-structlog",
    "pytest>=3",
    "responses",
    # keep-sorted end

]
linux = ["pystemd", "systemd"]
slurm = ["pyslurm"]

[dependency-groups]
dev = [
    # keep-sorted start
    "freezegun>=0.3",
    "pytest-cov",
    "pytest-mock",
    "pytest-structlog",
    "pytest>=3",
    "responses",
    # keep-sorted end
]

[project.scripts]
# keep-sorted start
fc-backy = "fc.manage.backy:main"
fc-backy-publish = "fc.manage.backy:publish"
fc-collect-garbage = "fc.manage.collect_garbage:app"
fc-create-vm = "fc.manage.createvm:main"
fc-directory = "fc.util.directory:directory_cli"
fc-graylog = "fc.manage.graylog:main"
fc-kea = "fc.manage.kea:main"
fc-keepalived = "fc.manage.keepalived:app"
fc-kubernetes = "fc.manage.kubernetes:app"
fc-maintenance = "fc.maintenance.cli:app"
fc-manage = "fc.manage.cli:app"
fc-monitor = "fc.manage.monitor:main"
fc-postgresql = "fc.manage.postgresql:app"
fc-qemu-scrub = "fc.manage.qemu:main"
fc-resize-disk = "fc.manage.resize_disk:app"
fc-slurm = "fc.manage.slurm:app"
fc-systemd = "fc.manage.systemd:app"
fc-zones = "fc.manage.zones:update"
fctl = "fc.util.fctl:app"
# keep-sorted end

[tool.black]
line-length = 80

[tool.isort]
profile = "black"
line_length = 80

[tool.pytest.ini_options]
addopts = "-vv --tb=native --strict-markers --cov=src/fc --cov-report=html"
markers = [
  "needs_nix: marks test that need a working Nix environment to download and build things"
]
testpaths = [ "src" ]
