[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project]
name = "fc.check_ceph"
version = "1.0"
description = "Ceph monitoring checks for Flying Circus"
authors = [
    {name = "Flying Circus Internet Operations GmbH", email = "mail@flyingcircus.io"}
]
license = {text = "ZPL"}
requires-python = ">=3.12"
dependencies = [
    "nagiosplugin",
]
classifiers = [
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
check_ceph = "fc.check_ceph.ceph:main"
check_snapshot_restore_fill = "fc.check_ceph.check_snapshot_restore:main"

[project.urls]
Homepage = "https://github.com/flyingcircus/nixpkgs"

[tool.setuptools.packages.find]
include = ["fc.check_ceph*"]
