#
# ceph.conf-global

[global]
fsid = be45fd6c-ea68-11e2-ad96-0200000311c0
public_network = 192.168.23.0/24
cluster_network = 172.16.8.0/24
max_open_files = 65535
mon_host = barbrady01.sto,bob.sto,selma.sto
osd_pool_default_min_size = 1
osd_pool_default_size = 2
osd_pool_default_pg_num = 32
osd_pool_default_pgp_num = 32

debug_auth = 0
debug_mon = 0
debug_monc = 0
debug_ms = 0
debug_paxos = 0

[client]
log_file = /var/log/ceph/client.log
rbd_cache = true
rbd_cache_size = 67108864
rbd_cache_max_dirty = 50331648
rbd_cache_target_dirty = 33554432
rbd_default_format = 2

[mon]
public_addr = 192.168.23.10,192.168.23.4,192.168.23.9
mon_data = /srv/ceph/mon/$cluster-$id
mon_data_avail_crit = 2
mon_data_avail_warn = 5
mon_pg_warn_max_object_skew = 8
#
# ceph.conf-osd
# global osd configuration
[osd]
public_addr = 192.168.23.14
cluster_addr = 172.16.8.7
filestore_fiemap = true
journal_queue_max_ops = 600
# slightly more than 1 week to avoid hitting the same day the same time
osd_deep_scrub_interval = 700000
osd_journal_size = 0
osd_max_backfills = 1
osd_op_complaint_time = 15
osd_recovery_max_active = 1
osd_recovery_op_priority = 1
osd_scrub_load_threshold = 2
post_start_command = sleep 5
#
# ceph.conf-osd-vol
# OSD configuration for an individual volume.
[osd.2]
host = cartman00
osd_uuid = feeb7116-8dea-5330-8925-9238b5860228
osd_data = /srv/ceph/osd/ceph-2
osd_journal = /dev/vgosd00/ceph-jnl00
filestore_max_sync_interval = 163
#
# ceph.conf-osd-vol
# OSD configuration for an individual volume.
[osd.5]
host = cartman00
osd_uuid = 0550ff5a-a051-5a21-9cc5-59b1270fb8e4
osd_data = /srv/ceph/osd/ceph-5
osd_journal = /dev/vgosd01/ceph-jnl01
filestore_max_sync_interval = 163
#
# ceph.conf-osd-vol
# OSD configuration for an individual volume.
[osd.4]
host = cartman00
osd_uuid = b8cfedd1-870d-5976-9c1f-627e02951f87
osd_data = /srv/ceph/osd/ceph-4
osd_journal = /dev/vgosd02/ceph-jnl02
