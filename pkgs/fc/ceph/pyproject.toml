[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools"]

[project]
name = "fc.ceph"
version = "2.1"
description = "Collection of FC-specific Ceph utilities."
license = { text = "ZPL"}
classifiers=["Programming Language :: Python :: 3"]
authors = [
  { name = "Flying Circus Internet Operations GmbH", email = "mail@flyingcircus.io" },
]
dependencies = [
    "nagiosplugin",
    "requests",
    "rich",
    "IPy",
]

[dependency-groups]
# NOTE: Please keep this sorted!
dev = [
    "pytest-cov",
    "pytest-patterns",
    "pytest-timeout",
    "pytest",
]

[project.scripts]
fc-ceph="fc.ceph.main:ceph"
fc-luks="fc.ceph.main:luks"
fc-s3users = "fc.ceph.s3users_main:main"

[tool.black]
line-length = 80
