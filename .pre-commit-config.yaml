exclude: ^secrets/|^appenv$|pkgs/fc/sensusyntax/fixtures/(syntaxerror|empty).json|(tests/testlib.nix|nixos/roles/devhost/vm.nix|tests/physical-installer.nix)
repos:
- hooks:
  - id: detect-private-key
  - id: check-added-large-files
  - exclude: "(?x)^(\n  secrets/|environments/.*/secret.*|\n  .*\\.patch\n)$\n"
    id: trailing-whitespace
  - exclude: "(?x)^(\n  environments/.*/secret.*|\n  .*\\.patch\n)$\n"
    id: end-of-file-fixer
  - exclude: "(?x)^(\n  environments/.*/secret.*|\n  .*\\.patch\n)$\n"
    id: check-yaml
  - exclude: "(?x)^(\n  environments/.*/secret.*|\n  .*\\.patch\n)$\n"
    id: check-json
  - exclude: "(?x)^(\n  environments/.*/secret.*|\n  .*\\.patch\n)$\n"
    id: check-xml
  - exclude: "(?x)^(\n  environments/.*/secret.*|\n  .*\\.patch\n)$\n"
    id: check-toml
  repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
- hooks:
  - args:
    - --profile
    - black
    - --filter-files
    id: isort
    name: isort (python)
  repo: https://github.com/pycqa/isort
  rev: 5.13.2
- hooks:
  - id: black
  repo: https://github.com/psf/black
  rev: 24.10.0
- hooks:
  - args:
    - --ignore
    - E501
    - --ignore
    - F401
    id: ruff
  repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.6.9
- hooks:
  - id: nixfmt
  repo: https://github.com/NixOS/nixfmt
  rev: a4639036723e510d8331124c80d9ca14dd7aba02
